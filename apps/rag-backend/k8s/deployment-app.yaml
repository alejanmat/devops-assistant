apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-backend
  namespace: rag
  labels:
    app: rag-backend
    app.kubernetes.io/part-of: home-lab-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-backend
  template:
    metadata:
      labels:
        app: rag-backend
    spec:
      containers:
        - name: rag-backend
          # CHANGE ME: replace with your built+pushed image (see pipeline).
          image: ghcr.io/your-user/home-lab-rag-backend:latest
          ports:
            - containerPort: 8000
          env:
            # Cross-cluster endpoints are reached over the Tailscale mesh.
            # Replace the *.compute / *.storage hosts with the Tailscale
            # hostnames or MagicDNS names of the respective cluster nodes,
            # e.g. http://compute-node:30080
            - name: LLM_BASE_URL
              value: "http://compute-node:30080"
            - name: EMBEDDING_BASE_URL
              value: "http://compute-node:30081"
            - name: QDRANT_URL
              value: "http://storage-node:32333"
            - name: REDIS_URL
              value: "redis://storage-node:32379/0"
            - name: EMBEDDING_DIM
              value: "768"
            - name: QDRANT_COLLECTION
              value: "ticino_fishing"
            # Auto-load the baked-in knowledge_base/ on startup. If the
            # embedding service is not ready yet, call POST /reindex later.
            - name: KB_AUTO_INGEST
              value: "true"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            limits:
              memory: "256Mi"
              cpu: "0.5"
            requests:
              memory: "128Mi"
              cpu: "0.1"
---
apiVersion: v1
kind: Service
metadata:
  name: rag-backend
  namespace: rag
  labels:
    app: rag-backend
    app.kubernetes.io/part-of: home-lab-rag
spec:
  type: NodePort
  selector:
    app: rag-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30800
