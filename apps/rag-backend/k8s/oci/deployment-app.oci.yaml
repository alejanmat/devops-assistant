apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-backend
  namespace: devops-rag
  labels:
    app: rag-backend
    app.kubernetes.io/part-of: home-lab-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-backend
  template:
    metadata:
      labels:
        app: rag-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: rag-backend
          # CHANGE ME: <tuo-username-github>, dopo aver fatto build+push su GHCR.
          image: ghcr.io/alejanmat/devops-rag-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            # Single cluster: nomi DNS in-cluster (<service>.<namespace>),
            # niente Tailscale. Combaciano con i default già in main.py.
            - name: LLM_BASE_URL
              value: "http://llama-llm-nodeport.compute:8080"
            - name: EMBEDDING_BASE_URL
              value: "http://llama-embedding-nodeport.compute:8080"
            - name: QDRANT_URL
              value: "http://qdrant-nodeport.storage:6333"
            - name: REDIS_URL
              value: "redis://redis-nodeport.storage:6379/0"
            - name: EMBEDDING_DIM
              value: "768"
            - name: QDRANT_COLLECTION
              value: "k8s_guide"
            # Auto-load the baked-in knowledge_base/ on startup. If the
            # embedding service is not ready yet, call POST /reindex later.
            - name: KB_AUTO_INGEST
              value: "true"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            limits:
              memory: "256Mi"
              cpu: "0.5"
            requests:
              memory: "128Mi"
              cpu: "0.1"
---
apiVersion: v1
kind: Service
metadata:
  name: rag-backend
  namespace: devops-rag
  labels:
    app: rag-backend
    app.kubernetes.io/part-of: home-lab-rag
spec:
  # ClusterIP: l'accesso pubblico passa dall'Ingress (Traefik), non serve
  # esporre una porta sui nodi.
  type: ClusterIP
  selector:
    app: rag-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
