# ArgoCD repository credential — HTTPS + Personal Access Token variant.
#
# HOW TO USE
#   1. Copy this file to `repo-secret.yaml` (that name is git-ignored):
#        cp repo-secret.example.yaml repo-secret.yaml
#   2. Fill in `username` and `password` (the PAT) below.
#   3. Apply to the argocd namespace on EACH cluster (compute AND storage):
#        kubectl apply -n argocd -f repo-secret.yaml
#
# PAT SCOPE (least privilege)
#   - Fine-grained token: repository = home-lab-rag-monorepo only,
#     permission "Contents: Read-only".
#   - Or classic token with the `repo` scope (read is enough for ArgoCD).
#
# SECURITY
#   Do NOT commit the filled-in copy. For a Git-tracked secret use
#   Sealed Secrets or External Secrets Operator instead (see PRIVATE_REPO_ACCESS.md).
apiVersion: v1
kind: Secret
metadata:
  name: metaxploit-rag
  namespace: argocd
  labels:
    # This label is what makes ArgoCD treat the Secret as a repo credential.
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/alejanmat/devops-assistant.git
  username: your-user
  password: REPLACE_WITH_GITHUB_PAT
