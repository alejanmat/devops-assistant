# ArgoCD repository credential — SSH deploy-key variant.
#
# HOW TO USE
#   1. Generate a key pair (no passphrase so ArgoCD can use it non-interactively):
#        ssh-keygen -t ed25519 -f argocd_ticino -N "" -C "argocd@homelab"
#   2. Add the PUBLIC key (argocd_ticino.pub) to the GitHub repo:
#        Settings -> Deploy keys -> Add deploy key -> paste, leave "Allow write" UNCHECKED.
#   3. Copy this file to `repo-secret.yaml` (git-ignored) and paste the PRIVATE
#      key (contents of `argocd_ticino`) into sshPrivateKey below.
#   4. Apply to the argocd namespace on EACH cluster (compute AND storage):
#        kubectl apply -n argocd -f repo-secret.yaml
#
# IMPORTANT
#   With SSH, the Application `repoURL` must use the SSH form:
#     git@github.com:your-user/home-lab-rag-monorepo.git
#   (not the https:// form). Update root-app-compute.yaml / root-app-storage.yaml
#   accordingly if you choose this variant.
#
#   A deploy key is scoped to a single repo and read-only here — good least
#   privilege for a home lab. Never commit the filled-in copy.
apiVersion: v1
kind: Secret
metadata:
  name: metaxploit-rag-ssh
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: git@github.com:alejanmat/devops-assistant.git
  sshPrivateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE_WITH_THE_CONTENTS_OF_argocd_ticino
    (the PRIVATE key, keep the BEGIN/END lines, preserve indentation)
    -----END OPENSSH PRIVATE KEY-----
