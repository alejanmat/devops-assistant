# Headless service required by the Qdrant StatefulSet for stable network IDs,
# plus NodePort services for cross-cluster access over the Tailscale mesh.
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: storage
  labels:
    app: qdrant
    app.kubernetes.io/part-of: home-lab-rag
spec:
  clusterIP: None
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-nodeport
  namespace: storage
  labels:
    app: qdrant
    app.kubernetes.io/part-of: home-lab-rag
spec:
  type: NodePort
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
      nodePort: 32333
---
apiVersion: v1
kind: Service
metadata:
  name: redis-nodeport
  namespace: storage
  labels:
    app: redis
    app.kubernetes.io/part-of: home-lab-rag
spec:
  type: NodePort
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      nodePort: 32379
