apiVersion: v1
kind: Service
metadata:
  name: llama-llm-nodeport
  namespace: compute
  labels:
    app: llama-llm
    app.kubernetes.io/part-of: home-lab-rag
spec:
  type: NodePort
  selector:
    app: llama-llm
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: llama-embedding-nodeport
  namespace: compute
  labels:
    app: llama-embedding
    app.kubernetes.io/part-of: home-lab-rag
spec:
  type: NodePort
  selector:
    app: llama-embedding
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
